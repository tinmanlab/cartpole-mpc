name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-native.txt
      - run: npm ci
      - run: pip install -r requirements-native.txt playwright==1.61.0
      - run: python -m playwright install --with-deps chromium
      - name: Source, assets and regression contracts
        run: npm run check
      - name: Actual official MuJoCo WASM and canonical MJCF
        run: npm run test:wasm
      - name: Independent OSQP numerical parity (unchanged tolerance)
        run: python tests/test_native_reference.py --require-browser-parity
      - name: Exact same MJCF, native versus WASM replay
        run: python tests/test_wasm_native.py
      - name: Real browser network, solver and failure paths
        run: npm run test:browser
      - name: Compact wheelbot model, live control and pacing
        run: |
          python tests/test_wheelbot_live_model.py
          node tests/test_wheelbot_live_runtime.mjs
          node tests/test_wheelbot_live_parity.mjs
          python tests/test_wheelbot_live_browser.py
      - name: Wheelbot portable native, WASM and browser release gates
        run: |
          python -m py_compile tests/test_wheelbot_release_browser.py
          python tests/test_wheelbot_release_routes.py
          python tests/export_wheelbot_tracking_reference.py
          node tests/test_wheelbot_contact_tracking_wasm.mjs
          node tests/test_wheelbot_configuration.mjs
          node tests/test_wheelbot_contact.mjs
          python tests/test_wheelbot_contact_reference.py
          python tests/test_wheelbot_release_browser.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            test-results/
            evidence/*.json
            evidence/*.png
