name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-native.txt
      - run: npm ci
      - run: pip install -r requirements-native.txt playwright==1.61.0
      - run: python -m playwright install --with-deps chromium
      - name: Actual runtime identity and optional jump isolation
        run: |
          python tests/test_runtime_versions.py
          node tests/test_runtime_versions.mjs
          node tests/test_wheelbot_viewer_timing.mjs
          node tests/test_wheelbot_jump_completion.mjs
      - name: Source, assets and regression contracts
        run: npm run check
      - name: Actual official MuJoCo WASM and canonical MJCF
        run: npm run test:wasm
      - name: Independent OSQP numerical parity (unchanged tolerance)
        run: python tests/test_native_reference.py --require-browser-parity
      - name: Exact same MJCF, native versus WASM replay
        run: python tests/test_wasm_native.py
      - name: Real browser network, solver and failure paths
        run: npm run test:browser
      - name: Canonical box native design and WASM path evidence
        run: |
          failed=0
          python tests/test_wheelbot_live_model.py || failed=1
          node tests/test_wheelbot_live_parity.mjs || failed=1
          node tests/test_wheelbot_box_paths.mjs || failed=1
          node tests/test_wheelbot_simple_ui.mjs || failed=1
          node tests/test_wheelbot_paths_runtime.mjs || failed=1
          python tests/test_wheelbot_box_parity.py || failed=1
          python tests/test_wheelbot_pose.py || failed=1
          node tests/test_wheelbot_preview_isolation.mjs || failed=1
          node tests/test_wheelbot_review_fixes.mjs || failed=1
          node tests/test_wheelbot_request_replacement.mjs || failed=1
          exit "$failed"
      - name: Historical offline contact physics regressions
        if: always()
        run: |
          python tests/export_wheelbot_tracking_reference.py
          node tests/test_wheelbot_contact_tracking_wasm.mjs
          node tests/test_wheelbot_configuration.mjs
          node tests/test_wheelbot_contact.mjs
          python tests/test_wheelbot_contact_reference.py
      - name: Historical aspirational fast-response benchmark (failure retained)
        if: always()
        continue-on-error: true
        run: node tests/test_wheelbot_paths_runtime.mjs --require-fast
      - name: Fresh native target jump before WASM parity
        if: always()
        run: python tests/test_wheelbot_target_jump.py && node tests/test_wheelbot_target_jump.mjs && node tests/test_wheelbot_target_jump_actions.mjs
      - name: Requested latest version release gate
        if: always()
        run: |
          python tests/test_runtime_versions.py --require-latest
          node tests/test_runtime_versions.mjs --require-latest
      - name: Keyboard game prototype acceptance (draft feature)
        if: always()
        run: |
          node tests/test_wheelbot_game_input.mjs
          node tests/test_wheelbot_game_ui.mjs
          node tests/test_wheelbot_game_world.mjs
          node tests/test_wheelbot_game_control.mjs
          python tests/test_wheelbot_game_jump_reference.py
          node tests/test_wheelbot_game_jump.mjs
          node tests/test_wheelbot_continuous_charge.mjs
          node tests/test_wheelbot_game_fall.mjs
      - name: Path lesson and keyboard game actual browser acceptance
        if: always()
        run: |
          python -m py_compile tests/test_wheelbot_paths_browser.py tests/test_wheelbot_game_browser.py
          mkdir -p test-results
          python -m http.server 8765 --bind 127.0.0.1 > test-results/wheelbot-game-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          failed=0
          python tests/test_wheelbot_paths_browser.py --url http://127.0.0.1:8765/wheelbot-paths.html || failed=1
          python tests/test_wheelbot_game_browser.py --url http://127.0.0.1:8765/wheelbot.html || failed=1
          exit "$failed"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            test-results/
            evidence/*.json
            evidence/*.png
