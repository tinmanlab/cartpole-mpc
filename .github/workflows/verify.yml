name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-native.txt
      - run: npm ci
      - run: pip install -r requirements-native.txt playwright==1.61.0
      - name: Separate constraint-active diagnostic and independent native checks
        run: python tests/test_constraint_diagnostic.py
      - run: python -m playwright install --with-deps chromium
      - name: No-admissible finalization and retry regression
        run: |
          python -m venv test-results/venv-finalization
          test-results/venv-finalization/bin/pip install -r requirements-tuning.txt
          test-results/venv-finalization/bin/python tests/test_tuning_finalization.py
      - name: Source, assets and regression contracts
        run: npm run check
      - name: Actual official MuJoCo WASM and canonical MJCF
        run: npm run test:wasm
      - name: Independent OSQP numerical parity (unchanged tolerance)
        run: python tests/test_native_reference.py --require-browser-parity
      - name: Exact same MJCF, native versus WASM replay
        run: python tests/test_wasm_native.py
      - name: Full Riccati parity and frozen terminal validation
        run: python tests/test_terminal_reference.py && npm run validate:terminal
      - name: Real browser network, solver and failure paths
        run: npm run test:browser
      - name: N-chain model, native reference, frozen failure screen and browser
        run: |
          python tests/test_chain_model.py
          npm run test:chain
          python tests/test_chain_reference.py
          python tests/test_chain_preconditioned_reference.py
          python tests/test_chain_ekf_reference.py
          python scripts/diagnose_chain_output_feedback.py
          python scripts/diagnose_chain_feasibility.py
          npm run validate:chain
          node scripts/validate_chain.mjs --prestabilized
          node scripts/validate_chain.mjs --prestabilized --ekf
          node scripts/probe_chain_local.mjs
          npm run test:chain-browser
      - name: Sensor calibration causal lesson and same-data replay
        run: |
          npm run validate:calibration
          python tests/test_calibration_reference.py
          python tests/test_calibration_browser.py
          npm run validate:process
          python tests/test_process_reference.py
          python tests/test_process_browser.py
      - name: Common task design, independent ranking and actual application
        run: |
          npm run validate:design
          python tests/test_design_reference.py
          python tests/test_design_browser.py
      - name: Recorded sequential-tuner evidence and offline-results UI
        run: |
          python tests/test_tuning_receipt.py
          python tests/test_tuning_browser.py

      - name: Bounded planar wheelbot numerical and browser checks
        run: |
          npm run test:wheelbot
          npm run test:wheelbot:mpc
          python tests/test_wheelbot_mpc_reference.py
          node scripts/validate_wheelbot_mpc.mjs --new-seeds --response
          python tests/test_wheelbot_response_reference.py
          python tests/test_wheelbot_reference.py
          python tests/test_wheelbot_browser.py
      - name: Preserve wheelbot browser verification
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheelbot-browser-verification
          path: |
            evidence/wheelbot_browser.png
            evidence/wheelbot_browser.json
            evidence/wheelbot_validation.json
            evidence/wheelbot_native_reference.json
            evidence/wheelbot_mpc_reference.json
            evidence/wheelbot_mpc_response_validation.json
            evidence/wheelbot_response_design.json
          if-no-files-found: error
          retention-days: 7
